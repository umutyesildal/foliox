<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- FolioX favicon (NEON FOUNDRY de-Rome pass, 2026-09-12): the FOUNDRY MARK
       on a near-black rounded square — hexagon outline + three descending
       weight bars in electric-yellow #FCEE0A on #0A0A0B, corner radius
       sharpened to 4 per spec §7. Same 24x24 relative geometry as LogoMark in
       components/shell/site-header.tsx, centered (mark bbox center 12,12) and
       scaled 1.2x so the mark fills the 32px frame while the stroke renders
       at ~1px at a 16px tab size. Same mark also in apple-icon.tsx and
       opengraph-image.tsx. -->
  <rect width="32" height="32" rx="4" fill="#0A0A0B"/>
  <g transform="translate(16 16) scale(1.2) translate(-12 -12)">
    <!-- hexagon container, sharp miter joins -->
    <path d="M12 2.5 L20.2 7.25 V16.75 L12 21.5 L3.8 16.75 V7.25 Z"
          fill="none" stroke="#FCEE0A" stroke-width="1.7" stroke-linejoin="miter"/>
    <!-- three descending weight bars (filled rects, no stroke) -->
    <g fill="#FCEE0A">
      <rect x="8" y="8.1" width="8.6" height="2.1"/>
      <rect x="8" y="11.95" width="6.6" height="2.1"/>
      <rect x="8" y="15.8" width="4.6" height="2.1"/>
    </g>
  </g>
</svg>
