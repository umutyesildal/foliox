<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 400px; height: 400px; overflow: hidden; }
  body { background: #0A0A0B; position: relative; display: flex; align-items: center; justify-content: center; }
  .hex-back {
    position: absolute; opacity: 0.05;
  }
  .mark { position: relative; }
</style>
</head>
<body>
  <!-- faint hexagonal cap outline behind the mark — depth, causeway hint -->
  <svg class="hex-back" width="360" height="360" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="0.35">
    <path d="M12 2.5 L20.2 7.25 V16.75 L12 21.5 L3.8 16.75 V7.25 Z"/>
  </svg>
  <!-- BASALT MARK, filled with cap-facet seams; sized for X's circular crop -->
  <svg class="mark" width="252" height="252" viewBox="0 0 24 24">
    <g fill="#FCEE0A">
      <path d="M4.3 3.7 L6.5 2.5 L8.7 3.7 L8.7 21.5 L4.3 21.5 Z"/>
      <path d="M9.8 10.7 L12 9.5 L14.2 10.7 L14.2 21.5 L9.8 21.5 Z"/>
      <path d="M15.3 15.7 L17.5 14.5 L19.7 15.7 L19.7 21.5 L15.3 21.5 Z"/>
    </g>
    <g stroke="#0A0A0B" stroke-width="0.55">
      <line x1="4.3" y1="3.7" x2="8.7" y2="3.7"/>
      <line x1="9.8" y1="10.7" x2="14.2" y2="10.7"/>
      <line x1="15.3" y1="15.7" x2="19.7" y2="15.7"/>
    </g>
  </svg>
</body>
</html>
