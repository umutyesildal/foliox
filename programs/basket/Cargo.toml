[package]
name = "basket"
version = "0.1.0"
description = "FolioX basket program — holds xStocks, mint/redeem share token, fees"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "basket"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
