[package]
name = "basket_factory"
version = "0.1.0"
description = "FolioX basket factory — deploys immutable baskets with atomic seed"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "basket_factory"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
whitelist = { path = "../whitelist" }
basket = { path = "../basket" }
